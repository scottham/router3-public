# Behind Cloudflare Tunnel every connection comes from cloudflared, so the
# client is CF-Connecting-IP. The port is bound to 127.0.0.1, so only the tunnel
# and local users reach it; direct local requests fall back to the peer address.
map $http_cf_connecting_ip $client_ip {
  "" $remote_addr;
  default $http_cf_connecting_ip;
}
map $http_x_forwarded_proto $client_proto {
  "" $scheme;
  default $http_x_forwarded_proto;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 1m;
  resolver 127.0.0.11 valid=5s ipv6=off;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  # /user/balance is DeepSeek's unprefixed balance path, answered by the API.
  location ~ ^/(v1/|user/balance$|healthz$|readyz$) {
    set $gateway http://api:8787;
    proxy_pass $gateway;
    proxy_http_version 1.1;
    proxy_read_timeout 150s;
    # Chat requests may carry base64 images; the API enforces its own limits.
    client_max_body_size 21m;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $client_ip;
    proxy_set_header X-Forwarded-Proto $client_proto;
    add_header Cache-Control "no-store" always;
  }
  location / {
    try_files $uri $uri/ /index.html;
  }
}
