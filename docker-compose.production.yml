name: ${COMPOSE_PROJECT_NAME:-router3-mainnet}

x-app: &app
  image: ${APP_IMAGE:-router3-mainnet-app}
  build: .
  restart: unless-stopped

x-common: &common
  NODE_ENV: ${NODE_ENV:-production}
  CHAIN_CONFIG_JSON: ${CHAIN_CONFIG_JSON}
  DB_POOL_MAX: 6
  DB_APPLICATION_NAME: router3-mainnet
  LOG_LEVEL: info
  TREASURY_ADDRESS: ${TREASURY_ADDRESS:?}
  SETTLER_ADDRESS: ${SETTLER_ADDRESS:?}

# x402 channel settings shared by the API (prices, deposits) and the collector (claims).
x-x402: &x402
  X402_FACILITATOR_URL: ${X402_FACILITATOR_URL:-https://x402-facilitator.molandak.org}
  X402_WITHDRAW_DELAY_SECONDS: ${X402_WITHDRAW_DELAY_SECONDS:-86400}
  X402_MIN_DEPOSIT_USDC: ${X402_MIN_DEPOSIT_USDC:-0.1}
  X402_REQUEST_LIMIT_USDC: ${X402_REQUEST_LIMIT_USDC:-5}
  X402_MAX_CHANNELS_PER_PAYER: ${X402_MAX_CHANNELS_PER_PAYER:-128}
  API_KEY_MAX_CONCURRENCY: ${API_KEY_MAX_CONCURRENCY:-128}
  API_KEY_REQUEST_LIMIT_USDC: ${API_KEY_REQUEST_LIMIT_USDC:-50}
  API_KEY_HOLD_OUTPUT_TOKENS: ${API_KEY_HOLD_OUTPUT_TOKENS:-8192}
  X402_CLAIM_MIN_USDC: ${X402_CLAIM_MIN_USDC:-1}
  X402_CLAIM_IDLE_SECONDS: ${X402_CLAIM_IDLE_SECONDS:-86400}
  X402_CLAIM_INTERVAL_SECONDS: ${X402_CLAIM_INTERVAL_SECONDS:-600}
  SETTLER_SIGNER_URL: http://signer:8790/sign
  SETTLER_SIGNER_BEARER_TOKEN: ${SETTLER_SIGNER_BEARER_TOKEN}
  # Prepaid pool (API keys): docs/PREPAID_POOL.md.
  POOL_ADDRESS: ${POOL_ADDRESS:-}
  POOL_SETTLE_MIN_USDC: ${POOL_SETTLE_MIN_USDC:-1}
  POOL_SETTLE_MAX_WAIT_SECONDS: ${POOL_SETTLE_MAX_WAIT_SECONDS:-604800}
  POOL_REFILL_BELOW_BPS: ${POOL_REFILL_BELOW_BPS:-5000}
  POOL_REFILL_WAIT_MS: ${POOL_REFILL_WAIT_MS:-15000}
  POOL_PERMIT_MIN_BALANCE_USDC: ${POOL_PERMIT_MIN_BALANCE_USDC:-1}
  POOL_ACTIVATION_FEE_USDC: ${POOL_ACTIVATION_FEE_USDC:-0.05}
  POOL_SWEEP_MIN_USDC: ${POOL_SWEEP_MIN_USDC:-1}

services:
  db:
    image: postgres:17-bookworm@sha256:639ab7ceb90e13123085b741fb31ef493fba25463002f6da665352e7b534b652
    environment:
      POSTGRES_DB: router3
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U postgres -d router3']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7.4.8-alpine@sha256:7aec734b2bb298a1d769fd8729f13b8514a41bf90fcdd1f38ec52267fbaa8ee6
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Run the Redis configuration command first}
    command: [sh, -c, 'exec redis-server --requirepass "$$REDIS_PASSWORD" --appendonly yes --maxmemory 256mb --maxmemory-policy noeviction']
    volumes: ["redis:/data"]
    healthcheck:
      test: [CMD-SHELL, 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -q PONG']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api:
    <<: *app
    # Long enough for an in-flight stream (570 s limit) to finish and settle;
    # see src/lib/shutdown.js. Deploy with ops/deploy-api.sh.
    stop_grace_period: 630s
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
      signer: {condition: service_started}
    # Provider keys (providers.env) and providers.json: the API calls providers directly.
    env_file: ["${PROVIDER_ENV_FILE:-./providers/empty.env}"]
    volumes: ["${PROVIDER_CONFIG_FILE:-./providers/providers.legacy.json}:/app/providers/providers.json:ro"]
    environment:
      <<: [*common, *x402]
      # Postgres allows 100 connections; a rolling deploy runs two API containers.
      DB_POOL_MAX: ${API_DB_POOL_MAX:-32}
      MCG_RUNTIME: api
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://localhost:3000}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      TRUST_PROXY: true
      MONAD_RPC_URL: ${MONAD_RPC_URL}
      APP_NAME: ${APP_NAME:-Router 3}
      APP_LOGO_URL: ${APP_LOGO_URL:-}
      REDIS_REQUIRED: true
      REDIS_URL: ${REDIS_URL}
      REDIS_NAMESPACE: ${REDIS_NAMESPACE:-router3-mainnet}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-80}
      RATE_LIMIT_WINDOW: ${RATE_LIMIT_WINDOW:-1 second}
      DATABASE_URL_API: ${DATABASE_URL_API}
      AUTH_SESSION_HMAC_SECRET: ${AUTH_SESSION_HMAC_SECRET}
      AUTH_ALLOWED_ADDRESSES: ${AUTH_ALLOWED_ADDRESSES:-}
      RESPONSE_ENCRYPTION_KEYS: ${RESPONSE_ENCRYPTION_KEYS}
      REAL_MODEL_CALLS_ENABLED: ${REAL_MODEL_CALLS_ENABLED:-false}
      PROVIDER_CONFIG_PATH: /app/providers/providers.json
      STREAM_REQUEST_TIMEOUT_MS: ${STREAM_REQUEST_TIMEOUT_MS:-570000}

  # The only process holding the Settler key: it signs channel claims and
  # refunds (EIP-712), bounded by the channel mirror, and broadcasts pool
  # transactions rebuilt from the database. Its MON pays pool transaction gas.
  signer:
    <<: *app
    # Runs as the owner of the 0600 settler key file (bind-mounted secret).
    user: "${SIGNER_UID:-1000}:${SIGNER_GID:-1000}"
    command: [node, src/signing/settlement-server.js]
    depends_on:
      db: {condition: service_healthy}
    environment:
      NODE_ENV: production
      DATABASE_URL_SIGNER: ${DATABASE_URL_SIGNER}
      SETTLEMENT_SIGNER_KEY_FILE: /run/secrets/settler_key
      SETTLER_SIGNER_BEARER_TOKEN: ${SETTLER_SIGNER_BEARER_TOKEN}
      # Prepaid pool transactions: only to this contract (checked by code hash).
      POOL_ADDRESS: ${POOL_ADDRESS:-}
      POOL_CODE_HASH: ${POOL_CODE_HASH:-}
      TREASURY_ADDRESS: ${TREASURY_ADDRESS:?}
      MONAD_RPC_URL: ${MONAD_RPC_URL}
    secrets: [settler_key]

  # Claims charged vouchers in batches and settles them to the Treasury
  # through the facilitator, which pays the gas; debits and refills prepaid
  # pools through the signer, which pays the gas from the Settler.
  collector:
    <<: *app
    command: [node, src/runtime.js]
    depends_on:
      db: {condition: service_healthy}
      signer: {condition: service_started}
    # The OpenRouter management key and providers.json: a wallet's OpenRouter
    # key limit follows its pool daily limit as soon as a configure confirms.
    env_file: ["${PROVIDER_ENV_FILE:-./providers/empty.env}"]
    volumes: ["${PROVIDER_CONFIG_FILE:-./providers/providers.legacy.json}:/app/providers/providers.json:ro"]
    environment:
      <<: [*common, *x402]
      MCG_RUNTIME: collector
      MONAD_RPC_URL: ${MONAD_RPC_URL}
      DATABASE_URL_SETTLER: ${DATABASE_URL_SETTLER}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://localhost:3000}
      PROVIDER_CONFIG_PATH: /app/providers/providers.json

  catalog:
    <<: *app
    command: [node, ops/catalog-worker.mjs]
    env_file: ["${PROVIDER_ENV_FILE:-./providers/empty.env}"]
    depends_on:
      db: {condition: service_healthy}
    environment:
      DATABASE_URL_CATALOG: ${DATABASE_URL_CATALOG}
      PROVIDER_CONFIG_PATH: /app/providers/providers.json
      MODEL_MARKUP_BPS: 0
      CALL_SERVICE_FEE_BPS: ${CALL_SERVICE_FEE_BPS:-100}
      CNY_PER_USD: ${CNY_PER_USD:-}
      CATALOG_REFRESH_SECONDS: ${CATALOG_REFRESH_SECONDS:-86400}
      PROVIDER_KEY_SYNC_SECONDS: ${PROVIDER_KEY_SYNC_SECONDS:-3600}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://localhost:3000}
      RESPONSE_ENCRYPTION_KEYS: ${RESPONSE_ENCRYPTION_KEYS}
      DEEPSEEK_PRICE_SOURCE: ${DEEPSEEK_PRICE_SOURCE:-page}
      CATALOG_ACCESS_CHECK_SECONDS: ${CATALOG_ACCESS_CHECK_SECONDS:-604800}
      CATALOG_RECHECK_ACCESS: ${CATALOG_RECHECK_ACCESS:-false}
    volumes: ["./ops:/app/ops:ro", "${PROVIDER_CONFIG_FILE:-./providers/providers.legacy.json}:/app/providers/providers.json:ro", "./providers/catalog.json:/app/providers/catalog.json:ro", "./providers/deepseek-prices.json:/app/providers/deepseek-prices.json:ro"]

  # Closes requests whose API process died and expires sign-in data.
  reconciler:
    <<: *app
    command: [node, src/runtime.js]
    depends_on:
      db: {condition: service_healthy}
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      DB_APPLICATION_NAME: router3-mainnet
      LOG_LEVEL: info
      MCG_RUNTIME: reconciler
      DATABASE_URL_RECONCILER: ${DATABASE_URL_RECONCILER}

  web:
    image: ${WEB_IMAGE:-router3-mainnet-web}
    build:
      context: .
      dockerfile: web/Dockerfile
      args:
        VITE_API_BASE_URL: ${PUBLIC_APP_URL:-http://localhost:3000}
        VITE_WALLETCONNECT_PROJECT_ID: ${WALLETCONNECT_PROJECT_ID:-}
    ports: ["127.0.0.1:${HTTP_PORT:-3000}:80"]
    volumes: ["./ops/nginx.conf:/etc/nginx/conf.d/default.conf:ro"]
    depends_on: [api]
    restart: unless-stopped

  # Optional public entry: docker compose --profile cloudflare up -d cloudflared.
  # The tunnel's public hostname points at http://web:80 (docs/CLOUDFLARE.md).
  cloudflared:
    image: cloudflare/cloudflared:2026.10.4@sha256:c6c7ae1d5dfdcb094ad344ed68ccffc26635c9c6be80965664c33baf064b0515
    profiles: [cloudflare]
    command: [tunnel, --no-autoupdate, run]
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on: [web]
    restart: unless-stopped

  # Optional monitoring: docker compose --profile metrics up -d metrics alloy.
  # The exporter is read-only; Alloy pushes to Grafana Cloud (docs/MONITORING.md).
  metrics:
    <<: *app
    profiles: [metrics]
    command: [node, ops/metrics-exporter.mjs]
    depends_on:
      db: {condition: service_healthy}
    environment:
      DATABASE_URL_METRICS: ${DATABASE_URL_METRICS:-}
      MONAD_RPC_URL: ${MONAD_RPC_URL:-https://rpc.monad.xyz}
      CHAIN_CONFIG_JSON: ${CHAIN_CONFIG_JSON}
      SETTLER_ADDRESS: ${SETTLER_ADDRESS:-}
      TREASURY_ADDRESS: ${TREASURY_ADDRESS}
    volumes: ["./ops:/app/ops:ro"]

  alloy:
    image: grafana/alloy:v1.20.1@sha256:2aa2099af76c0098d4af7a4d6e48f86cb66dc1a000222ad927a1c67c6542d13f
    profiles: [metrics]
    command: [run, --storage.path=/var/lib/alloy, /etc/alloy/config.alloy]
    environment:
      GRAFANA_PROM_URL: ${GRAFANA_PROM_URL:-}
      GRAFANA_PROM_USER: ${GRAFANA_PROM_USER:-}
      GRAFANA_PROM_TOKEN: ${GRAFANA_PROM_TOKEN:-}
      METRICS_INSTANCE: ${METRICS_INSTANCE:-router3-mainnet}
    volumes:
      - ./ops/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - alloy:/var/lib/alloy
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host/root:ro,rslave
      - /run/udev/data:/run/udev/data:ro
    depends_on: [metrics]
    restart: unless-stopped

  bootstrap:
    image: ${APP_IMAGE:-router3-mainnet-app}
    profiles: [ops]
    command: [node, ops/bootstrap-production-db.mjs]
    env_file: ["${PROVIDER_ENV_FILE:-./providers/empty.env}"]
    depends_on:
      db: {condition: service_healthy}
    environment:
      DATABASE_URL_ADMIN: ${DATABASE_URL_ADMIN}
      DATABASE_URL_API: ${DATABASE_URL_API}
      DATABASE_URL_SETTLER: ${DATABASE_URL_SETTLER}
      DATABASE_URL_RECONCILER: ${DATABASE_URL_RECONCILER}
      DATABASE_URL_SIGNER: ${DATABASE_URL_SIGNER}
      DATABASE_URL_CATALOG: ${DATABASE_URL_CATALOG}
      DATABASE_URL_METRICS: ${DATABASE_URL_METRICS:-}
      PROVIDER_CONFIG_PATH: /app/providers/providers.json
      CNY_PER_USD: ${CNY_PER_USD:-}
      MODEL_MARKUP_BPS: 0
      CALL_SERVICE_FEE_BPS: ${CALL_SERVICE_FEE_BPS:-100}
    volumes:
      - ./ops:/app/ops:ro
      - ./supabase:/app/supabase:ro
      - ./providers/catalog.json:/app/providers/catalog.json:ro
      - ./providers/deepseek-prices.json:/app/providers/deepseek-prices.json:ro
      - ${PROVIDER_CONFIG_FILE:-./providers/providers.legacy.json}:/app/providers/providers.json:ro

volumes:
  postgres:
  redis:
  alloy:
secrets:
  settler_key:
    file: ${SETTLER_KEY_FILE:-./.secrets/monad-settler.key}
